<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thử tài Kiến thức Hành chính</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        body {
            /* Modern Tech Gradient Background */
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        /* Tech Grid Overlay */
        .grid-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: -1;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .option-btn {
            transition: all 0.2s ease-in-out;
        }

        .option-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.2);
            border-color: #3b82f6;
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(1px);
            box-shadow: 0 0px 0px rgba(0, 0, 0, 0);
        }

        /* Glowing next button */
        .btn-glow {
            animation: pulse-glow 2s infinite;
        }

        @keyframes pulse-glow {
            0% {
                box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.5);
            }

            70% {
                box-shadow: 0 0 0 15px rgba(59, 130, 246, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(59, 130, 246, 0);
            }
        }
    </style>
</head>

<body class="p-4 relative">

    <div class="grid-overlay"></div>

    <div id="game-container"
        class="glass-panel rounded-3xl p-8 md:p-12 max-w-4xl w-full animate-fade-in relative overflow-hidden">

        <!-- Subtle accent shape -->
        <div
            class="absolute top-0 right-0 -mt-16 -mr-16 w-32 h-32 bg-blue-500 rounded-full blur-3xl opacity-20 pointer-events-none">
        </div>
        <div
            class="absolute bottom-0 left-0 -mb-16 -ml-16 w-32 h-32 bg-indigo-500 rounded-full blur-3xl opacity-20 pointer-events-none">
        </div>

        <!-- Start Screen -->
        <div id="start-screen" class="text-center py-8 relative z-10">
            <div class="inline-flex items-center justify-center w-24 h-24 rounded-full bg-blue-100 text-blue-600 mb-6">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                </svg>
            </div>
            <h1 class="text-4xl md:text-5xl font-extrabold text-slate-800 mb-4 tracking-tight">
                Thử tài Kiến thức
            </h1>
            <p class="text-lg text-slate-500 mb-10 font-medium">Khám phá những thay đổi hành chính mới nhất qua 5 câu
                hỏi trắc nghiệm.</p>
            <button onclick="startGame()"
                class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-12 rounded-xl text-xl transition-all shadow-[0_4px_14px_0_rgba(37,99,235,0.39)] hover:shadow-[0_6px_20px_rgba(37,99,235,0.23)]">
                Bắt đầu ngay
            </button>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="hidden relative z-10">
            <!-- Header (Progress & Score) -->
            <div class="flex justify-between items-center mb-8 pb-4 border-b border-slate-200">
                <div class="flex items-center space-x-2">
                    <div
                        class="w-10 h-10 rounded-lg bg-blue-100 flex items-center justify-center text-blue-600 font-bold">
                        <span id="question-counter">1</span>
                    </div>
                    <span class="text-slate-500 font-medium text-sm">/ 5 Câu hỏi</span>
                </div>
                <div class="flex items-center px-4 py-2 bg-slate-100 rounded-lg">
                    <span class="text-slate-500 font-medium mr-2">Điểm:</span>
                    <span id="score-display" class="text-blue-600 font-bold text-xl">0</span>
                </div>
            </div>

            <!-- Question Text -->
            <h2 id="question-text"
                class="text-2xl md:text-3xl font-bold text-slate-800 mb-10 min-h-[100px] leading-snug"></h2>

            <!-- Options Grid -->
            <div id="options-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Options injected via JS -->
            </div>

            <!-- Feedback Message -->
            <div id="feedback" class="mt-8 text-center font-bold text-xl hidden h-8 animate-fade-in"></div>

            <!-- Next Button -->
            <div class="mt-8 flex justify-end">
                <button id="next-btn" onclick="nextQuestion()"
                    class="bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 px-8 rounded-xl hidden transition-all btn-glow flex items-center">
                    Câu tiếp theo
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 ml-2" viewBox="0 0 20 20"
                        fill="currentColor">
                        <path fill-rule="evenodd"
                            d="M12.293 5.293a1 1 0 011.414 0l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-2.293-2.293a1 1 0 010-1.414z"
                            clip-rule="evenodd" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- End Screen -->
        <div id="end-screen" class="hidden text-center py-10 relative z-10">
            <div
                class="inline-flex items-center justify-center w-28 h-28 rounded-full bg-emerald-100 text-emerald-500 mb-6 shadow-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </div>

            <h2 class="text-4xl font-extrabold text-slate-800 mb-4">
                Hoàn thành xuất sắc!
            </h2>

            <p class="text-lg text-slate-500 mb-6 font-medium">
                Bạn đã trả lời đúng:
            </p>

            <div class="flex items-center justify-center mb-8">
                <span id="final-score" class="text-7xl font-black text-blue-600"></span>
                <span class="text-4xl text-slate-400 font-bold ml-2">/5</span>
            </div>

            <p id="result-message" class="text-xl text-slate-700 mb-10 font-semibold"></p>

            <div class="flex flex-col sm:flex-row items-center justify-center gap-4 px-4">
                <a href="/tulieu/#kham-pha-da-nang"
                    class="w-full sm:w-auto inline-flex items-center justify-center bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-8 rounded-xl text-lg transition-all shadow-md">
                    <i class="fa-solid fa-arrow-left mr-2"></i>
                    Trở về
                </a>
                <button onclick="resetGame()"
                    class="w-full sm:w-auto bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold py-4 px-8 rounded-xl text-lg transition-all border border-slate-300">
                    <i class="fa-solid fa-rotate-right mr-2"></i>
                    Thử sức lại vòng mới
                </button>


            </div>
        </div>
    </div>

    <script>
        const quizData = [
            {
                question: "Huyện miền núi Nông Sơn nổi tiếng với mỏ than, nay đã bị bãi bỏ cấp huyện và đổi thành đơn vị hành chính mang tên gì?",
                correct: "Xã Nông Sơn.",
                wrong: ["Xã Quế Sơn.", "Xã Phước Sơn.", "Phường Nông Sơn."]
            },
            {
                question: "Cầu Rồng và Cầu quay Sông Hàn nối liền trung tâm nay bắc qua hai phường lớn nào của TP. Đà Nẵng?",
                correct: "Phường Hải Châu và Phường Sơn Trà.",
                wrong: ["Phường Hải Châu và Phường Ngũ Hành Sơn.", "Phường Thanh Khê và Phường Sơn Trà.", "Phường Cẩm Lệ và Phường Sơn Trà."]
            },
            {
                question: "Hai xã đảo hiếm hoi của Thành phố Đà Nẵng được giữ nguyên vẹn, không nằm trong diện sáp nhập của đợt cải cách này là 2 xã nào?",
                correct: "Xã Tam Hải và Xã Tân Hiệp (nơi có Cù Lao Chàm).",
                wrong: ["Xã Tam Hải và Xã Tam Giang.", "Xã Tân Hiệp và Xã Cẩm Thanh.", "Xã Tam Giang và Xã Lý Sơn."]
            },
            {
                question: "Các phường thuộc thị xã Điện Bàn cũ nay được sắp xếp lại thành 2 phường lớn trực thuộc TP. Đà Nẵng. Đó là hai phường nào?",
                correct: "Phường Điện Bàn và Phường Điện Bàn Đông.",
                wrong: ["Phường Điện Bàn Bắc và Phường Điện Bàn Nam.", "Phường Vĩnh Điện và Phường Điện Ngọc.", "Phường Điện Bàn và Phường Điện Nam."]
            },
            {
                question: "Làng bích họa Tam Thanh mộc mạc ngày nào nay đã sáp nhập cùng An Phú, Tam Phú để trở thành phường mới mang tên là gì?",
                correct: "Phường Quảng Phú.",
                wrong: ["Phường Tam Thanh.", "Phường An Phú.", "Phường Tam Quan."]
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let canAnswer = true;
        let currentCorrectAnswer = "";

        const startScreen = document.getElementById('start-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const endScreen = document.getElementById('end-screen');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const nextBtn = document.getElementById('next-btn');
        const feedback = document.getElementById('feedback');
        const scoreDisplay = document.getElementById('score-display');
        const questionCounter = document.getElementById('question-counter');

        // Hàm xáo trộn mảng (Fisher-Yates shuffle) để randomize vị trí đáp án
        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function startGame() {
            startScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');
            quizScreen.classList.add('animate-fade-in');
            loadQuestion();
        }

        function loadQuestion() {
            canAnswer = true;
            nextBtn.classList.add('hidden');
            feedback.classList.add('hidden');

            const currentQ = quizData[currentQuestionIndex];
            questionText.innerText = currentQ.question;
            questionCounter.innerText = currentQuestionIndex + 1;

            // Xáo trộn đáp án trước khi hiển thị
            let options = [currentQ.correct, ...currentQ.wrong];
            options = shuffleArray(options);
            currentCorrectAnswer = currentQ.correct;

            optionsContainer.innerHTML = '';

            options.forEach((optionText, index) => {
                const button = document.createElement('button');

                // Giao diện nút công nghệ: viền mảnh, nền sáng nhẹ
                button.innerHTML = `<span class="font-semibold">${optionText}</span>`;
                button.className = `option-btn w-full text-left p-5 rounded-xl text-lg text-slate-700 bg-slate-50 border-2 border-slate-200`;

                button.onclick = () => selectOption(button, optionText);
                optionsContainer.appendChild(button);
            });
        }

        function selectOption(selectedButton, selectedText) {
            if (!canAnswer) return;
            canAnswer = false; // Ngăn chặn bấm nhiều lần

            const allButtons = optionsContainer.children;

            // Xử lý logic tô màu nút sau khi click
            for (let i = 0; i < allButtons.length; i++) {
                allButtons[i].disabled = true; // Khóa nút
                allButtons[i].classList.add('opacity-70');
                allButtons[i].classList.remove('hover:border-[#3b82f6]', 'bg-slate-50');
                allButtons[i].classList.add('bg-slate-100'); // Trạng thái bị làm mờ

                // Hiển thị đáp án đúng (Màu Xanh lá Emerald)
                if (allButtons[i].innerText === currentCorrectAnswer) {
                    allButtons[i].className = `option-btn w-full text-left p-5 rounded-xl text-lg font-bold text-white bg-emerald-500 border-2 border-emerald-600 opacity-100 animate-fade-in`;
                }
            }

            selectedButton.classList.remove('opacity-70', 'bg-slate-100');

            if (selectedText === currentCorrectAnswer) {
                score++;
                scoreDisplay.innerText = score;
                feedback.innerHTML = "✓ Chính xác tuyệt đối!";
                feedback.className = "mt-8 text-center font-bold text-xl text-emerald-500 animate-fade-in";
            } else {
                // Hiển thị đáp án sai (Màu Đỏ Rose)
                selectedButton.className = `option-btn w-full text-left p-5 rounded-xl text-lg font-bold text-white bg-rose-500 border-2 border-rose-600 opacity-100 animate-fade-in`;

                feedback.innerHTML = "✗ Rất tiếc, chưa chính xác!";
                feedback.className = "mt-8 text-center font-bold text-xl text-rose-500 animate-fade-in";
            }

            feedback.classList.remove('hidden');
            nextBtn.classList.remove('hidden');
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < quizData.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            quizScreen.classList.add('hidden');
            endScreen.classList.remove('hidden');
            endScreen.classList.add('animate-fade-in');
            document.getElementById('final-score').innerText = score;

            const msg = document.getElementById('result-message');
            if (score === 5) {
                msg.innerText = "Điểm tuyệt đối! Kiến thức của bạn thật đáng nể.";
            } else if (score >= 3) {
                msg.innerText = "Kết quả rất tốt! Bạn nắm bắt thông tin khá vững.";
            } else {
                msg.innerText = "Chưa đạt tối đa, nhưng đây là cơ hội tốt để học hỏi thêm!";
            }
        }

        function resetGame() {
            currentQuestionIndex = 0;
            score = 0;
            scoreDisplay.innerText = score;
            endScreen.classList.add('hidden');
            startGame();
        }
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khám Phá STEM - Nhà Khoa Học Nhí</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap');
        
        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            background: linear-gradient(135deg, #fff5f3 0%, #fffafa 55%, #f8e3e5 100%);
            color: #30252a;
            text-align: center;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            background-attachment: fixed;
        }
        
        h1 {
            font-family: 'Be Vietnam Pro', sans-serif;
            font-size: 3em;
            margin: 20px 0 10px;
            text-shadow: 0 5px 15px rgba(91,20,34,0.12);
            background: linear-gradient(to right, #7f1729, #d63b4e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .container { max-width: 850px; margin: 0 auto; }
        
        .card {
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(12px);
            border: 1px solid #f0dfe1;
            border-radius: 30px;
            padding: 30px;
            margin: 25px auto;
            box-shadow: 0 15px 40px rgba(91, 20, 34, 0.10);
            transition: transform 0.4s ease;
        }
        
        .card:hover { transform: translateY(-8px); }
        
        button {
            background: linear-gradient(135deg, #b21f35, #d63b4e);
            color: white;
            border: none;
            padding: 16px 35px;
            margin: 12px;
            border-radius: 50px;
            font-size: 1.25em;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(178, 31, 53, 0.24);
            transition: all 0.3s ease;
        }
        
        button:hover {
            transform: scale(1.08) translateY(-3px);
            box-shadow: 0 12px 25px rgba(178, 31, 53, 0.28);
        }
        
        .question { 
            font-size: 1.55em; 
            margin: 35px 0; 
            line-height: 1.4;
            text-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        
        .options button {
            display: block;
            width: 85%;
            margin: 14px auto;
            background: #fff0f0;
            color: #7f1729;
            box-shadow: 0 6px 15px rgba(91,20,34,0.1);
        }
        
        .options button:hover {
            background: #f8dfe2;
        }
        
        .score { 
            font-size: 2.2em; 
            color: #b21f35;
            text-shadow: 0 3px 10px rgba(91,20,34,0.12);
            margin-bottom: 15px;
        }
        
        .feedback { 
            margin: 25px 0; 
            font-size: 1.4em; 
            min-height: 70px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏆 Nhà Khoa Học Nhí - Khám Phá Thành Phố Biển</h1>
        <p style="font-size:1.3em; margin-bottom:30px;">Thử thách kiến thức STEM vui nhộn!</p>
        
        <div id="start-screen" class="card">
            <h2>Bạn sẵn sàng làm nhà khoa học chưa? 🚀</h2>
            <button onclick="startGame()">BẮT ĐẦU TRÒ CHƠI NGAY!</button>
        </div>

        <div id="game-screen" class="card" style="display:none;">
            <div class="score">Điểm: <span id="score">0</span>/5</div>
            <div id="question" class="question"></div>
            <div id="options" class="options"></div>
            <div id="feedback" class="feedback"></div>
            <button onclick="nextQuestion()" id="next-btn" style="display:none;">Câu tiếp theo →</button>
        </div>

        <div id="end-screen" class="card" style="display:none;">
            <h2>Hoàn thành rồi! 🎉</h2>
            <div class="score" id="final-score"></div>
            <p id="message"></p>
            <button onclick="restartGame()">Chơi lại</button>
        </div>
    </div>

    <script>
        const questions = [
            {q: "Cầu Rồng phun lửa và nước. Đây là ứng dụng của nguyên lý nào?", options: ["Vật lý nhiệt", "Hóa học", "Sinh học", "Âm nhạc"], correct: 0},
            {q: "Nước biển mặn vì chứa nhiều gì?", options: ["Đường", "Muối (NaCl)", "Dầu", "Sữa"], correct: 1},
            {q: "Thiết kế thuyền chạy bằng năng lượng gió sẽ dùng gì?", options: ["Pin mặt trời", "Buồm và cánh quạt", "Động cơ xăng", "Xe đạp"], correct: 1},
            {q: "Robot dọn rác biển thuộc lĩnh vực STEM nào?", options: ["Toán học thuần túy", "Kỹ thuật + Công nghệ", "Chỉ vẽ tranh", "Âm nhạc"], correct: 1},
            {q: "Cây xanh trên núi quan trọng vì hấp thụ gì?", options: ["Làm đẹp", "CO₂ và tạo oxy", "Chỉ cho chim", "Không quan trọng"], correct: 1}
        ];

        let currentQuestion = 0, score = 0;

        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            currentQuestion = 0; score = 0;
            loadQuestion();
        }

        function loadQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('question').innerHTML = `<strong>Câu ${currentQuestion + 1}:</strong> ${q.q}`;
            const opts = document.getElementById('options');
            opts.innerHTML = '';
            q.options.forEach((opt, i) => {
                const b = document.createElement('button');
                b.textContent = opt;
                b.onclick = () => checkAnswer(i);
                opts.appendChild(b);
            });
            document.getElementById('feedback').innerHTML = '';
            document.getElementById('next-btn').style.display = 'none';
        }

        function checkAnswer(selected) {
            const q = questions[currentQuestion];
            const fb = document.getElementById('feedback');
            document.querySelectorAll('#options button').forEach(b => b.disabled = true);
            
            if (selected === q.correct) {
                score++;
                fb.innerHTML = '✅ Đúng rồi! Giỏi quá!';
                fb.style.color = '#167248';
            } else {
                fb.innerHTML = `❌ Đáp án đúng: ${q.options[q.correct]}`;
                fb.style.color = '#b21f35';
            }
            
            document.getElementById('score').textContent = score;
            document.getElementById('next-btn').style.display = 'inline-block';
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < questions.length) loadQuestion();
            else endGame();
        }

        function endGame() {
            document.getElementById('game-screen').style.display = 'none';
            const end = document.getElementById('end-screen');
            end.style.display = 'block';
            const perc = Math.round((score / questions.length) * 100);
            document.getElementById('final-score').innerHTML = `Điểm: ${score}/${questions.length} (${perc}%)`;
            document.getElementById('message').innerHTML = perc >= 80 ? 'Bạn là Nhà Khoa Học Xuất Sắc! 🌟' : perc >= 60 ? 'Bạn làm rất tốt rồi!' : 'Cảm ơn bạn! Hãy thử lại nhé!';
        }

        function restartGame() {
            document.getElementById('end-screen').style.display = 'none';
            document.getElementById('start-screen').style.display = 'block';
        }
    </script>
</body>
</html>
